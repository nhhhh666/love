<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06010b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>给 吕弈凝</title>
<meta name="description" content="">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="给 吕弈凝">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;height:100%;overflow:hidden;background:#04010a;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
#cv{position:fixed;inset:0;display:block;z-index:1;}

/* ---------- 中心爱心 ---------- */
#core{
  position:fixed;left:50%;z-index:3;
  transform:translate(-50%,-50%) scale(.12);
  opacity:0;
  transition:transform 1.5s cubic-bezier(.15,.85,.25,1),opacity 1.5s ease;
  will-change:transform,opacity;
}
#core.on{transform:translate(-50%,-50%) scale(1);opacity:1;}
#core svg{display:block;overflow:visible;}
#coreBeat{transform-origin:50% 44%;animation:beat 1.2s cubic-bezier(.4,0,.6,1) infinite;}
@keyframes beat{
  0%{transform:scale(1);}
  10%{transform:scale(1.075);}
  22%{transform:scale(1.015);}
  34%{transform:scale(1.052);}
  52%{transform:scale(1);}
  100%{transform:scale(1);}
}

/* ---------- 文字 ---------- */
#txt{
  position:fixed;left:0;right:0;z-index:4;
  text-align:center;pointer-events:none;padding:0 18px;
  transition:opacity .8s ease;
}
.ln{
  opacity:0;transform:translateY(20px);
  transition:opacity 1s ease,transform 1s cubic-bezier(.15,.85,.25,1);
  will-change:transform,opacity;
}
.ln.on{opacity:1;transform:translateY(0);}
#nm{
  font-size:clamp(28px,8.2vw,50px);font-weight:700;letter-spacing:.18em;
  color:#fff;
  text-shadow:
    0 0 6px #fff,
    0 0 16px rgba(255,150,200,.95),
    0 0 34px rgba(255,60,150,.85),
    0 0 70px rgba(235,20,120,.6),
    0 0 120px rgba(200,0,110,.4);
}
#w1{
  margin-top:13px;font-size:clamp(16px,4.9vw,28px);font-weight:500;letter-spacing:.24em;
  color:#ffdcee;
  text-shadow:0 0 10px rgba(255,170,215,.95),0 0 28px rgba(255,80,160,.7),0 0 60px rgba(230,40,140,.45);
}
#w2{
  margin-top:16px;font-size:clamp(11px,3.3vw,16px);letter-spacing:.2em;
  color:#cdb4ff;
  text-shadow:0 0 10px rgba(185,130,255,.9),0 0 26px rgba(130,80,255,.55);
}

/* ---------- 左上日期 ---------- */
#dayLine{
  position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top));
  z-index:6;text-align:center;
  font-size:10px;letter-spacing:.18em;
  color:rgba(255,200,230,.42);
  opacity:0;transition:opacity 1.6s ease;
  pointer-events:none;
}

/* ---------- 场景名 ---------- */
#sceneName{
  position:fixed;left:0;right:0;top:calc(38px + env(safe-area-inset-top));
  z-index:6;text-align:center;
  font-size:10.5px;letter-spacing:.62em;
  color:rgba(255,190,225,.34);
  pointer-events:none;
  opacity:0;
}
#sceneName.flash{animation:sf 3s ease forwards;}
@keyframes sf{
  0%{opacity:0;letter-spacing:.9em;}
  18%{opacity:1;letter-spacing:.62em;}
  70%{opacity:.85;}
  100%{opacity:.28;}
}

/* ---------- 页脚 ---------- */
#foot{
  position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));
  text-align:center;z-index:4;font-size:9px;letter-spacing:.44em;
  color:rgba(255,175,215,.28);
  opacity:0;transition:opacity 2s ease;
  pointer-events:none;
}
#foot.on{opacity:1;}

#hint{
  position:fixed;left:0;right:0;bottom:16%;z-index:5;text-align:center;
  font-size:12px;letter-spacing:.38em;color:rgba(255,195,228,.5);
  animation:blink 2.8s ease-in-out infinite;
  pointer-events:none;
}
@keyframes blink{0%,100%{opacity:.1;}50%{opacity:.8;}}
#veil{position:fixed;inset:0;z-index:9;background:#04010a;pointer-events:none;opacity:1;transition:opacity 1.2s ease;}
#veil.gone{opacity:0;}

/* ---------- 词条气泡 ---------- */
#tip{
  position:fixed;left:0;top:0;z-index:8;
  max-width:74vw;
  padding:9px 15px;
  border-radius:16px;
  background:rgba(28,6,30,.88);
  border:1px solid rgba(255,120,180,.42);
  box-shadow:0 4px 26px rgba(255,40,130,.30),inset 0 0 20px rgba(255,90,160,.10);
  color:#ffe3f0;
  font-size:13px;line-height:1.62;letter-spacing:.05em;
  pointer-events:none;
  opacity:0;
  transform:translate(-50%,-50%) scale(.9);
  transition:opacity .18s ease,transform .18s ease;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  white-space:normal;
}
#tip.on{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* ---------- 底部按钮 ---------- */
#bar{
  position:fixed;left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom));
  z-index:7;display:flex;justify-content:center;gap:9px;
  opacity:0;transition:opacity 1.2s ease;pointer-events:none;
  flex-wrap:wrap;padding:0 12px;
}
#bar.on{opacity:1;pointer-events:auto;}
#bar button{
  font-family:inherit;font-size:12px;letter-spacing:.2em;
  padding:8px 16px;border-radius:19px;cursor:pointer;
  color:#ffd9ea;
  background:rgba(40,8,36,.55);
  border:1px solid rgba(255,120,180,.35);
  box-shadow:0 0 16px rgba(255,50,140,.22);
  transition:all .22s ease;
  -webkit-appearance:none;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
#bar button:active{
  background:rgba(255,60,140,.28);
  box-shadow:0 0 26px rgba(255,50,140,.55);
  transform:scale(.96);
}

/* ---------- 信息面板 ---------- */
#panel{
  position:fixed;inset:0;z-index:21;
  background:rgba(6,1,10,.95);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  padding:16px 12px;
  opacity:0;pointer-events:none;
  transition:opacity .38s ease;
}
#panel.on{opacity:1;pointer-events:auto;}
#panelInner{
  width:100%;max-width:600px;max-height:100%;
  display:flex;flex-direction:column;
  background:linear-gradient(160deg,rgba(34,7,34,.94),rgba(16,4,24,.97));
  border:1px solid rgba(255,110,175,.26);
  border-radius:18px;
  overflow:hidden;
}
#panelTitle{
  padding:16px 20px 10px;
  font-size:14px;letter-spacing:.26em;color:#ffcfe4;
  text-shadow:0 0 14px rgba(255,110,180,.7);
  flex:0 0 auto;
}
#panelTabs{
  display:flex;gap:6px;padding:0 14px 10px;flex:0 0 auto;
  overflow-x:auto;scrollbar-width:none;
}
#panelTabs::-webkit-scrollbar{display:none;}
#panelTabs button{
  font-family:inherit;font-size:11.5px;letter-spacing:.14em;
  padding:6px 12px;border-radius:14px;cursor:pointer;white-space:nowrap;
  color:#e3c4e8;background:rgba(255,60,140,.08);
  border:1px solid rgba(255,120,180,.22);
  -webkit-appearance:none;transition:all .2s ease;
}
#panelTabs button.on{
  color:#fff;background:rgba(255,60,140,.30);
  border-color:rgba(255,140,200,.6);
  box-shadow:0 0 14px rgba(255,60,140,.4);
}
#panelBody{
  padding:6px 20px 20px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  flex:1 1 auto;
  color:#e6d4ec;font-size:13px;line-height:1.85;
}
#panelClose{
  margin:0 20px 16px;padding:10px 0;
  font-family:inherit;font-size:12.5px;letter-spacing:.26em;
  border-radius:12px;cursor:pointer;flex:0 0 auto;
  color:#ffd9ea;background:rgba(255,60,140,.14);
  border:1px solid rgba(255,120,180,.36);
  -webkit-appearance:none;
}
#panelClose:active{background:rgba(255,60,140,.34);}

.big{
  font-size:26px;letter-spacing:.3em;color:#fff;
  text-shadow:0 0 18px rgba(255,90,170,.9),0 0 44px rgba(200,50,255,.6);
  margin:8px 0 10px;
}
.sub{
  font-size:12.5px;color:#d9bde6;line-height:1.9;
  margin-bottom:14px;padding-bottom:12px;
  border-bottom:1px solid rgba(255,110,175,.14);
}
.kv{font-size:12.5px;color:#d6c0e2;margin:7px 0;line-height:1.9;}
.kv b{
  display:inline-block;min-width:5.6em;
  color:#ffb8d8;font-weight:600;letter-spacing:.1em;
}
.hintsmall{
  margin-top:14px;font-size:10.5px;line-height:1.8;
  color:rgba(255,190,225,.36);letter-spacing:.04em;
}
.grid24{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;}
.grid24 .cell{
  padding:7px 6px;border-radius:9px;
  background:rgba(255,70,150,.05);
  border:1px solid rgba(255,110,175,.12);
  display:flex;flex-direction:column;gap:2px;
}
.grid24 .cell.cur{
  background:rgba(255,60,140,.24);
  border-color:rgba(255,150,205,.6);
  box-shadow:0 0 14px rgba(255,60,140,.35);
}
.grid24 .cn{font-size:12px;color:#ffd3e8;letter-spacing:.1em;}
.grid24 .cd{font-size:9px;color:rgba(220,190,235,.62);line-height:1.5;}
.calTitle{text-align:center;font-size:14px;letter-spacing:.24em;color:#ffcfe4;margin:6px 0 10px;}
.calHead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px;}
.calHead span{text-align:center;font-size:10px;color:rgba(255,190,225,.45);}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.calCell{
  min-height:40px;border-radius:7px;padding:3px 2px;
  background:rgba(255,70,150,.04);
  border:1px solid rgba(255,110,175,.10);
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.calCell.empty{background:transparent;border-color:transparent;}
.calCell.today{
  background:rgba(255,60,140,.26);
  border-color:rgba(255,150,205,.65);
  box-shadow:0 0 12px rgba(255,60,140,.4);
}
.calCell .dn{font-size:11px;color:#f0dcef;}
.calCell .dt{font-size:8px;color:#ff9ecb;letter-spacing:.02em;}
.calCell .df{font-size:8px;color:#a9c6ff;}
.calCell .dl{font-size:8px;color:#ffcf8a;letter-spacing:0;}
.calCell.hol{background:rgba(255,150,60,.13);border-color:rgba(255,170,90,.32);}
.calCell.hol .dn{color:#ffdca8;}
.strow{
  padding:6px 0;border-bottom:1px solid rgba(255,110,175,.08);
  display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;
}
.strow b{font-size:12.5px;color:#ffd3e8;letter-spacing:.08em;}
.strow i{font-style:normal;font-size:10.5px;color:rgba(210,180,230,.6);}
.strow span{width:100%;font-size:10px;color:rgba(200,180,225,.55);}
.seaTitle{display:flex;align-items:center;gap:6px;margin:12px 0 6px;font-size:11px;letter-spacing:.2em;color:rgba(255,190,225,.5);}
.seaTitle.cur{color:#ffc4e0;}
.seaTitle em{font-style:normal;font-size:9px;opacity:.55;letter-spacing:0;}
.seaTitle::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,150,200,.22),transparent);}
.seaWrap{display:flex;flex-wrap:wrap;gap:5px;}
.seachip{font-size:11px;padding:3px 8px;border-radius:9px;color:rgba(230,210,245,.72);background:rgba(255,255,255,.04);border:1px solid rgba(255,160,205,.13);}
.seachip.cur{color:#ffe2f0;background:rgba(255,120,180,.16);border-color:rgba(255,140,195,.42);}

</style>
</head>
<body>
<canvas id="cv"></canvas>


<div id="txt">
  <div class="ln" id="nm">吕弈凝</div>
  <div class="ln" id="w1">天天开心</div>
  <div class="ln" id="w2">愿你所有的期待 都能如约而至</div>
</div>

<div id="dayLine"></div>
<div id="sceneName"></div>
<div id="foot">THE HEART IS YOURS</div>
<div id="hint">轻 触 屏 幕</div>

<div id="tip"><span id="tipTxt"></span></div>

<div id="bar">
  <button id="btnPanel" type="button">日 与 星</button>
</div>

<div id="panel">
  <div id="panelInner">
    <div id="panelTitle">日 与 星</div>
    <div id="panelTabs"></div>
    <div id="panelBody"></div>
    <button id="panelClose" type="button">关 闭</button>
  </div>
</div>

<div id="veil"></div>

function splitRows(s){ return s.split(';'); }
function parseXYZ(s){
  const rows = splitRows(s), n = rows.length;
  const out = new Float32Array(n*3);
  for (let i=0;i<n;i++){
    const p = rows[i].split(',');
    out[i*3]   = +p[0];
    out[i*3+1] = +p[1];
    out[i*3+2] = +p[2];
  }
  return out;
}
function parseXY(s){
  const rows = splitRows(s), n = rows.length;
  const out = new Float32Array(n*2);
  for (let i=0;i<n;i++){
    const p = rows[i].split(',');
    out[i*2]   = +p[0];
    out[i*2+1] = +p[1];
  }
  return out;
}
function parseSeed(s){
  const rows = splitRows(s), n = rows.length;
  const out = new Float32Array(n*5);
  for (let i=0;i<n;i++){
    const p = rows[i].split(',');
    out[i*5]   = +p[0];
    out[i*5+1] = +p[1];
    out[i*5+2] = +p[2];
    out[i*5+3] = +p[3];

  }

}

  const n = (s.length/7)|0, out = new Array(n);

}

function b64ToBytes(b64){
  const bin = atob(b64);
  const n = bin.length;
  const b = new Uint8Array(n);
  for (let i=0;i<n;i++) b[i] = bin.charCodeAt(i);
  return b;
}
function inflateBytes(u8){
  const ds = new DecompressionStream('deflate');
  return new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer()
    .then(function(buf){ return new Uint8Array(buf); });
}
function int8ToFloat(u8){
  const out = new Float32Array(u8.length);
  for (let i=0;i<u8.length;i++){
    let v = u8[i]; if (v > 127) v -= 256;
    out[i] = v * 0.01;
  }
  return out;
}
function parseTracks(s, count){
  const rows = s.split(';');
  const out = new Float32Array(count * FRAMES * 2);

    for (let f = 0; f < FRAMES; f++){

      const o = (i * FRAMES + f) * 2;
      out[o]   = +p[0];

  }

}

function trk(arr, i, phase01, out){
  const base = (i * FRAMES) * 2;

/* ============================================================
   布局
   ============================================================ */
let VW=0, VH=0, DPR=1;
let LX=0, LY=0, LW=0, LH=0;
let coreCxPx = 0, coreCyPx = 0;
let tTopPx = 0, tBotPx = 0;   // 三行文案的上下边界，词条要避开

function layoutNow(){
  VW = window.innerWidth;
  VH = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = Math.floor(VW*DPR);
  cv.height = Math.floor(VH*DPR);
  cv.style.width  = VW+'px';
  cv.style.height = VH+'px';

  const land = VW > VH;
  const maxW = land ? VW*0.60 : VW*0.92;
  const maxH = land ? VH*0.72 : VH*0.56;
  let w = maxW, h = w*(HH/HW);
  if (h > maxH){ h = maxH; w = h*(HW/HH); }

  LW = w; LH = h;
  LX = (VW - w)/2;
  LY = VH*(land?0.40:0.415) - h/2;

  coreCyPx = LY + LH*C_FRAC;
  coreCxPx = LX + LW/2;

  /* 没有中心小爱心了：文字接在爱心底部下方，绝不压到爱心 */
  const gap = Math.max(16, Math.min(44, VH*0.032));
  let tTop = (LY + LH) + gap;
  const room = VH - Math.max(170, VH*0.22);
  if (tTop > room){
    /* 底部空间不够：把爱心上移一点，但绝不允许顶部跑出屏幕 */
    const maxUp = Math.max(0, LY - Math.max(6, VH*0.02));
    const shift = Math.min(tTop - room, maxUp);
    LY -= shift;
    coreCyPx = LY + LH*C_FRAC;
    tTop = (LY + LH) + gap;
  }
  txtEl.style.top = tTop.toFixed(1)+"px";

  /* 记录文字区上下边界（全局），供词条避让用 */
  tTopPx = tTop;
  tBotPx = tTop + Math.max(150, VH*0.20);

  buildSprites();
}

let pathCache = null;
function wx(x){ return LX + (x + HW/2)/HW*LW; }
function wy(y){ return LY + (HTOP - y)/HH*LH; }

/* ============================================================
   ★ 光斑贴图：把发光球预渲染成离屏 canvas
     原来每颗粒子每帧都要 createRadialGradient（2480 次/帧），
     这是最大的性能瓶颈。改成贴图后，一帧只需 drawImage。
   ============================================================ */
const SPR = {};       // key: color -> [spriteSmall, spriteBig]
const SPR_KEYS = [];
let SPR_MAX = 0;
const sprCache = new Map();

function makeGlowSprite(color, size){
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const x = c.getContext('2d');
  const r = size/2;
  const gd = x.createRadialGradient(r, r, 0, r, r, r);
  gd.addColorStop(0,    'rgba(255,255,255,0.98)');
  gd.addColorStop(0.16, color);
  gd.addColorStop(0.34, color);
  gd.addColorStop(0.62, hexA(color, 0.34));
  gd.addColorStop(1,    hexA(color, 0));
  x.fillStyle = gd;
  x.beginPath(); x.arc(r, r, r, 0, 6.2832); x.fill();
  return c;
}
function hexA(hex, a){
  const n = parseInt(hex.substr(1), 16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function buildSprites(){
  sprCache.clear();
  const base = Math.max(14, Math.min(46, Math.round(LW*0.030)));
  const b2 = Math.round(base*0.52);
  const bk = Math.round(base*0.30);
  const list = COL.concat(COLD);
  for (let i=0;i<list.length;i++){
    const c = list[i];
    if (sprCache.has(c)) continue;
    sprCache.set(c, [
      makeGlowSprite(c, base),
      makeGlowSprite(c, b2),
      makeGlowSprite(c, bk)
    ]);
  }
  SPR_MAX = base;
}
let sprFallback = null;
function sprFor(color){
  const v = sprCache.get(color);
  if (v !== undefined) return v;
  if (sprFallback === null){
    const it = sprCache.values().next();
    sprFallback = it.done ? null : it.value;
  }
  return sprFallback;
}

/* ============================================================
   粒子系统
   ============================================================ */
const parts = [];
const inners = [];
const fills = [];
let built = false;

function buildAll(){
  if (built) return;
  built = true;
  const gap = PERIM / RINGN;
  const gapPx = gap / HW * LW;

  for (let i=0;i<RINGN;i++){
    const x = RING[i*3], y = RING[i*3+1], t = RING[i*3+2];
    const ci = Math.floor((t/(Math.PI*2))*COL.length) % COL.length;
    /* 起始位置：从落点向外抛出去，方向清楚、距离短，成形干净 */
    const _tx = wx(x), _ty = wy(y);
    const _dx = _tx - coreCxPx, _dy = _ty - coreCyPx;
    const _len = Math.hypot(_dx, _dy) || 1;
    const _out = 1.55 + RS[i*5+3]*1.05;   // 向外散开的倍率
    const ang = ci/COL.length*Math.PI*2;
    parts.push({
      tx: wx(x), ty: wy(y),
      x: coreCxPx + _dx*_out,
      y: coreCyPx + _dy*_out,
      col: COL[ci],
      r: Math.max(1.6, Math.min(7.0, gapPx*0.62)),
      ph: RS[i*5], sp: RS[i*5+1], am: RS[i*5+2],
      sa: RS[i*5+3], br: RS[i*5+4],
      ox: wx(x)-coreCxPx, oy: wy(y)-coreCyPx,
      rad: Math.hypot(wx(x)-coreCxPx, wy(y)-coreCyPx),
      ang: Math.atan2(wy(y)-coreCyPx, wx(x)-coreCxPx),
      /* 落位顺序：从底部尖端开始，沿心形两侧向上合拢，像一笔画出来 */
      tq: 0, dly: (t/(Math.PI*2))*1250 + Math.random()*90,
      ki: i
    });
  }

  const igapPx = gapPx*0.70;
  for (let i=0;i<INNERN;i++){
    const x = INNER[i*3], y = INNER[i*3+1], t = INNER[i*3+2];
    const ci = Math.floor((t/(Math.PI*2))*COL.length) % COL.length;
    const px = wx(x), py = wy(y);
    inners.push({
      tx: px, ty: py, x: px, y: py,
      col: COL[ci],
      r: Math.max(1.0, igapPx*0.50),
      ph: IS[i*5], sp: IS[i*5+1], am: IS[i*5+2],
      sa: IS[i*5+3], br: IS[i*5+4],
      ox: px-coreCxPx, oy: py-coreCyPx,
      rad: Math.hypot(px-coreCxPx, py-coreCyPx),
      ang: Math.atan2(py-coreCyPx, px-coreCxPx),
      a: 0
    });
  }

  for (let i=0;i<FILLN;i++){
    const px = wx(FILL[i*2]), py = wy(FILL[i*2+1]);
    fills.push({
      tx: px, ty: py, x: px, y: py,
      col: COLD[(i*13)%COLD.length],
      r: 1.0 + (i%17)/17*2.1,
      ph: FS[i*5], sp: FS[i*5+1], am: FS[i*5+2],
      sa: FS[i*5+3], br: FS[i*5+4],
      ox: px-coreCxPx, oy: py-coreCyPx,
      rad: Math.hypot(px-coreCxPx, py-coreCyPx),
      ang: Math.atan2(py-coreCyPx, px-coreCxPx),
      a: 0
    });
  }
}

   背景：星空 + 真实星座

let stars = [];
let constLines = [];
function buildStars(){
  stars = [];
  const n = Math.round(Math.min(560, (VW*VH)/1600));
  for (let i=0;i<n;i++){
    stars.push({
      x: Math.random(), y: Math.random(),
      r: 0.35 + Math.random()*1.6,
      a: 0.10 + Math.random()*0.62,
      sp: 0.3 + Math.random()*1.8,
      ph: Math.random()*6.2832,
      h: Math.random() < 0.22 ? 1 : 0     // 1 = 彩星
    });
  }
  // 星座连线：以星表里的赤经赤纬投影到屏幕（用固定 seed 保证每次一致）
  constLines = [];
  let seed = 12345;
  function rnd(){ seed = (seed*1103515245+12345) & 0x7fffffff; return seed/0x7fffffff; }
  for (let c = 0; c < 9; c++){
    const cx = rnd()*VW, cy = rnd()*VH;
    const n2 = 3 + (rnd()*4|0);
    const pts = [];
    for (let i=0;i<n2;i++){
      const a = rnd()*6.2832, d = rnd()*Math.min(VW,VH)*0.17;
      pts.push([cx+Math.cos(a)*d, cy+Math.sin(a)*d*0.8]);
    }
    constLines.push({ pts: pts, a: 0.06 + rnd()*0.10 });
  }
}

/* ============================================================
   状态机 / 场景
   ============================================================ */
let T0 = 0;
let running = false;
let started = false;
let T = 0;                 // 场景总时间（秒）

/* 场景表：三幕循环。不旋转，只飞入 -> 成形 -> 说给你听 */
const SCENES = [
  { name: '成 形',   dur: 4.6 },   // 粒子从外飞入，聚成心
  { name: '亮 起',   dur: 3.4 },   // 中心爱心浮现 + 三行字
  { name: '说 给 你', dur: 0 }      // 句子沿心转一圈，一句一句出现再消失（时长由句数决定）
];
let sceneIdx = 0;
let sceneT = 0;
let sceneDone = false;

/* 全局视觉参数（不旋转、不涡流，只做缩放和亮度） */
const VIS = {
  scale: 1,
  bright: 1
};
/* 兜底：任何视觉参数如果被算成 NaN，立刻拉回默认值，避免整屏黑掉/透明 */
const VIS_DEFAULT = Object.assign({}, VIS);
function sanitizeVis(){
  for (const k in VIS_DEFAULT){
    if (!isFinite(VIS[k])) VIS[k] = VIS_DEFAULT[k];
  }
}

function kick(){
  if (started) return;
  started = true;
  running = true;
  T0 = performance.now();
  hintEl.style.display = 'none';
  veilEl.classList.add('gone');
  requestAnimationFrame(loop);
}

function setScene(i){
  sceneIdx = i % SCENES.length;
  sceneT = 0;
  sceneDone = false;
  sceneEl.textContent = SCENES[sceneIdx].name;
  sceneEl.classList.remove('flash');
  void sceneEl.offsetWidth;
  sceneEl.classList.add('flash');
  onSceneEnter(sceneIdx);
}



function onSceneEnter(i){
  const barEl = document.getElementById('bar');
  if (i === 0){
    /* 第一幕：粒子正在飞入，一切文字与爱心都先收起来 */
    txtEl.style.opacity = 0;
    [nmEl, w1El, w2El, footEl].forEach(function(e){ e.classList.remove('on'); });
    if (barEl) barEl.classList.remove('on');
    for (let k = 0; k < inners.length; k++) inners[k].a = 0;
    for (let k = 0; k < fills.length; k++)  fills[k].a  = 0;
  }
  if (i === 1){
    /* 第二幕：中心爱心浮现，三行字依次亮起 */
    txtEl.style.opacity = 1;
    [nmEl, w1El, w2El, footEl].forEach(function(e){ e.classList.remove('on'); });
    if (barEl) barEl.classList.remove('on');
  }
  if (i === 2){
    /* 第三幕：文字退到淡淡一层，开始一句一句说话 */
    txtEl.style.opacity = 0.26;
    startWhisper();
  }
}

/* 第二幕的文字时序，由主循环按 sceneT 驱动（可测、不易错乱） */
function updateReveal(){
  if (sceneIdx !== 1) return;
  const barEl = document.getElementById('bar');
  const st = sceneT;
  if (st > 0.45 && !nmEl.classList.contains('on')) nmEl.classList.add('on');
  if (st > 1.00 && !w1El.classList.contains('on')) w1El.classList.add('on');
  if (st > 1.55 && !w2El.classList.contains('on')) w2El.classList.add('on');
  if (st > 2.10 && !footEl.classList.contains('on')) footEl.classList.add('on');
  if (st > 2.10 && barEl && !barEl.classList.contains('on')) barEl.classList.add('on');

  /* 内圈与星云随着幕时间逐渐亮起，用缓动不让它突然跳出来 */
  let e = (st - 0.20) / 1.80;
  if (e < 0) e = 0;
  if (e > 1) e = 1;
  e = 1 - Math.pow(1 - e, 3);
  for (let k = 0; k < inners.length; k++) inners[k].a = e;
  for (let k = 0; k < fills.length; k++)  fills[k].a  = e;
}

/* ============================================================
   词条播放：沿爱心轮廓连续流动的句子
   - 不再一句一句出现，而是多句同时沿弧线滑行
   - 整圈均匀铺开，像一条绕着心缓缓转动的字带
   ============================================================ */
const W_COUNT = 14;        // 一圈同时有多少句
const W_SPEED = 0.052;     // 每秒走多少圈比例，约 19 秒一圈

const whisper = {
  active: false,
  texts: [],
  slots: [],      // 每句的固定相位（0..1）
  t: 0,
  total: 0
};

const RING_TEXT = [
  '天天开心',
  '平安喜乐',
  '万事胜意',
  '岁岁平安',
  '身体健康',
  '一切顺利',
  '笑口常开',
  '得偿所愿',
  '心想事成',
  '前程似锦',
  '喜乐长安',
  '顺遂无忧',
  '心安自在',
  '幸福安稳',
];

/* 围着爱心转的句子：手写固定文案，不再从粒子池随机取 */
const DAY0 = Date.UTC(2026, 9, 25);   /* 2026-10-25 在一起 */
function ringDayNo(){
  const now = new Date();
  const t0 = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((t0 - DAY0) / 86400000) + 1;
}
function ringLine(k){
  const s = RING_TEXT[k % RING_TEXT.length];
  if (s.indexOf('%d') < 0) return s;
  return s.replace('%d', ringDayNo());
}
function startWhisper(){
  /* 主环粒子按极角排序，取均匀采样点作为句子轨道 */
  const pool = [];
  for (let i = 0; i < RINGN; i++){
    const p = parts[i];
    let a = Math.atan2(p.oy, p.ox) + Math.PI / 2;
    if (a < 0) a += Math.PI * 2;
    pool.push({ i: i, a: a });
  }
  pool.sort(function(A, B){ return A.a - B.a; });

  const texts = [], slots = [];
  const stepI = pool.length / W_COUNT;
  for (let k = 0; k < W_COUNT; k++){
    const pk = pool[Math.floor(k * stepI) % pool.length];
    texts.push(ringLine(k));
    slots.push(pk.a / (Math.PI * 2));
  }

  whisper.texts  = texts;
  whisper.slots  = slots;
  whisper.t      = 0;
  whisper.total  = W_COUNT;
  whisper.active = true;
}

function updateWhisper(dt){
  if (!whisper.active) return;
  whisper.t += dt * W_SPEED;
  if (whisper.t > 10000) whisper.t -= 10000;
}

/* 按归一化角度取轮廓坐标（线性插值，保证滑行平滑） */
function ringPointAt(a){
  a = a - Math.floor(a);
  const f = a * RINGN;
  const i0 = Math.floor(f) % RINGN;
  const i1 = (i0 + 1) % RINGN;
  const r = f - Math.floor(f);
  const p0 = parts[i0], p1 = parts[i1];
  const sc = VIS.scale;
  const x0 = coreCxPx + (p0.tx - coreCxPx) * sc;
  const y0 = coreCyPx + (p0.ty - coreCyPx) * sc;
  const x1 = coreCxPx + (p1.tx - coreCxPx) * sc;
  const y1 = coreCyPx + (p1.ty - coreCyPx) * sc;
  return [x0 + (x1 - x0) * r, y0 + (y1 - y0) * r];
}

function drawWhisper(){
  if (!whisper.active) return;

  const fs = Math.max(10, Math.min(16, VW * 0.030));
  g.font = '600 ' + fs.toFixed(1) + 'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';

  const base = whisper.t;
  const n = whisper.total;

  for (let k = 0; k < n; k++){
    /* 每句在固定相位上，整体一起绕圈走 */
    const a = (base + whisper.slots[k]) % 1;
    const pt = ringPointAt(a);

    /* 往外推，避免压在轮廓线上 */
    const dx = pt[0] - coreCxPx, dy = pt[1] - coreCyPx;
    const d  = Math.hypot(dx, dy) || 1;
    const push = Math.max(24, LW * 0.105);
    let tx = coreCxPx + (dx / d) * (d + push);
    let ty = coreCyPx + (dy / d) * (d + push);

    /* 避让中下部三行文案 */
    if (ty > tTopPx - 24 && ty < tBotPx + 24 && Math.abs(tx - VW * 0.5) < VW * 0.46){
      const out = (ty < (tTopPx + tBotPx) * 0.5) ? (tTopPx - 30 - ty) : (tBotPx + 30 - ty);
      ty += out;
    }

    /* 亮度：靠近顶部的句子亮一些，底部暗一些，增加层次 */
    const vpos = 1 - (ty / VH);
    let al = 0.34 + 0.52 * vpos;

    /* 每句自身缓慢呼吸，避免整个字带同时明减 */
    al *= 0.78 + 0.22 * Math.sin(base * 12.566 + k * 2.1);
    if (al < 0.10) al = 0.10;

    g.shadowBlur  = 13;
    g.shadowColor = 'rgba(255,96,176,' + (al * 0.85).toFixed(3) + ')';
    g.fillStyle   = 'rgba(255,236,248,' + al.toFixed(3) + ')';
    g.fillText(whisper.texts[k], tx, ty);
    g.shadowBlur = 0;
  }
  g.globalAlpha = 1;
}

/* ============================================================
   主循环
   ============================================================ */
let lastNow = 0;
let frameCount = 0;
let fpsAcc = 0, fpsN = 0, fps = 60;

function loop(now){
  if (!running) return;
  if (!lastNow) lastNow = now;
  let dt = (now - lastNow)/1000;
  lastNow = now;
  if (dt > 0.1) dt = 0.1;       // 切后台回来不要跳帧
  if (dt < 0) dt = 0.016;

  T = (now - T0)/1000;

  // 帧率统计（用于自适应降载）
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5){ fps = fpsN/fpsAcc; fpsAcc = 0; fpsN = 0; }

  // 场景推进
  sceneT += dt;
  const dur = (sceneIdx === 2) ? 9999 : SCENES[sceneIdx].dur;   // 第三幕常驻，句子一直流动
  if (sceneT >= dur){
    if (sceneIdx + 1 < SCENES.length){
      setScene(sceneIdx + 1);
    } else {
      // 整场演完，回到第一幕重新聚一次
      setScene(0);
    }
  }

  updateVis(dt);
  updateReveal();
  updateWhisper(dt);


  drawBG(T);
  drawHeart(T, dt);
  drawWhisper();
  drawVignette();

  requestAnimationFrame(loop);
}

/* 按场景计算视觉参数：只有缩放与亮度，绝不旋转 */
function updateVis(dt){
  const d = SCENES[sceneIdx].dur;
  const n = d > 0 ? Math.min(1, sceneT / d) : 1;
  const s = sceneIdx;
  let scale = 1, bright = 1;

  if (s === 0){
    /* 成形：粒子从四周飞入落位，期间整体由小到大、由暗到亮 */
    const e = easeOut(Math.min(1, sceneT/1.9));
    scale = 0.52 + 0.48*e;
    bright = 0.30 + 0.70*e;
  } else if (s === 1){
    /* 亮起：稳稳站着，只有极轻的呼吸（不放缩放幅度太大） */
    scale = 1 + 0.006*Math.sin(sceneT*1.5);
    bright = 1;
  } else {
    /* 说给你：静止不转，亮度随句子微微起伏 */
    scale = 1 + 0.004*Math.sin(sceneT*1.2);
    bright = 1.03;
  }

  const k = 1 - Math.pow(0.0015, dt);
  VIS.scale  += (scale  - VIS.scale)  * k;
  VIS.bright += (bright - VIS.bright) * k;
  sanitizeVis();
}
function easeOut(x){ return 1 - Math.pow(1-x, 3); }
function easeInOut(x){ return x<0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2; }

/* ---------- 背景 ---------- */
let bgCache = null, bgKey = '';
function drawBG(t){
  const key = VW+'x'+VH;
  if (key !== bgKey || !bgCache){
    bgKey = key;
    const c = document.createElement('canvas');
    c.width = Math.max(2, Math.floor(VW*0.5));
    c.height = Math.max(2, Math.floor(VH*0.5));
    const x = c.getContext('2d');
    const gd = x.createRadialGradient(c.width*0.5, c.height*0.40, 0,
                                      c.width*0.5, c.height*0.40, Math.max(c.width,c.height)*1.05);
    gd.addColorStop(0,    '#20082c');
    gd.addColorStop(0.28, '#150520');
    gd.addColorStop(0.58, '#0a0212');
    gd.addColorStop(0.82, '#040108');
    gd.addColorStop(1,    '#010004');
    x.fillStyle = gd;
    x.fillRect(0,0,c.width,c.height);
    bgCache = c;
  }
  g.setTransform(DPR,0,0,DPR,0,0);
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  g.drawImage(bgCache, 0, 0, VW, VH);

  // 星座连线
  g.lineWidth = 1;
  for (let c=0;c<constLines.length;c++){
    const cl = constLines[c];
    const a = cl.a * (0.55 + 0.45*Math.sin(t*0.6 + c));
    g.strokeStyle = 'rgba(190,170,255,'+a.toFixed(3)+')';
    g.beginPath();
    for (let i=0;i<cl.pts.length;i++){
      const p = cl.pts[i];
      if (i===0) g.moveTo(p[0], p[1]); else g.lineTo(p[0], p[1]);
    }
    g.stroke();
  }

  // 星星
  for (let i=0;i<stars.length;i++){
    const s = stars[i];
    const tw = 0.52 + 0.48*Math.sin(t*s.sp*1.5 + s.ph);
    const al = s.a*tw;
    if (al <= 0.02) continue;
    g.beginPath();
    g.arc(s.x*VW, s.y*VH, s.r, 0, 6.2832);
    g.fillStyle = s.h
      ? 'rgba(255,205,235,'+al.toFixed(3)+')'
      : 'rgba(228,236,255,'+al.toFixed(3)+')';
    g.fill();
  }
}

/* ---------- 心跳 ---------- */
const PERIOD = 1.2;
function beatScale(t){
  /* 轻微心跳：双峰，幅度控制在 2% 左右，形状不会变形 */
  const ph = (t % PERIOD) / PERIOD;
  if (ph < 0.12) return 1 + Math.sin(ph/0.12*Math.PI)*0.020;
  if (ph < 0.26) return 1 + Math.sin((ph-0.12)/0.14*Math.PI)*0.004;
  if (ph < 0.40) return 1 + Math.sin((ph-0.26)/0.14*Math.PI)*0.014;
  return 1;
}

/* ---------- 心形主渲染 ---------- */
function drawHeart(t, dt){
  const bs = beatScale(t);
  const cx = coreCxPx, cy = coreCyPx;
  const sc  = VIS.scale * bs;
  const br  = VIS.bright;
  /* 静止变换：只有缩放，没有旋转 */
  function xf(ox, oy){
    return [cx + ox * sc, cy + oy * sc];
  }

  /* ===== 1. 底层大光晕 ===== */
  const haloR = LW*0.80;
  const haloA = (0.24 + 0.10*Math.sin(t*1.8)) * br * sc;
  const hg = g.createRadialGradient(cx, cy, LW*0.06, cx, cy, haloR);
  hg.addColorStop(0,   'rgba(255,64,152,'+(haloA*0.62).toFixed(3)+')');
  hg.addColorStop(0.38,'rgba(214,44,176,'+(haloA*0.34).toFixed(3)+')');
  hg.addColorStop(0.68,'rgba(140,44,224,'+(haloA*0.16).toFixed(3)+')');
  hg.addColorStop(1,   'rgba(80,20,160,0)');
  g.fillStyle = hg;
  g.beginPath(); g.arc(cx, cy, haloR, 0, 6.2832); g.fill();
  /* ===== 2. 星云（内部光点） ===== */
  g.globalCompositeOperation = 'lighter';
  for (let i=0;i<fills.length;i++){
    const p = fills[i];
    if (p.a <= 0.01) continue;
    const bx = cx + p.ox * sc, by = cy + p.oy * sc;
    const wob = Math.sin(t*p.sp*1.3 + p.ph) * p.am * 1.6;
    const px = bx + wob, py = by + Math.cos(t*p.sp*1.1 + p.ph)*p.am*1.6;
    const al = p.a * p.br * br * (0.55 + 0.45*Math.sin(t*p.sp*2.1 + p.ph*2.3));
    if (al <= 0.015) continue;
    const spr = sprFor(p.col);
    const sz = p.r * 6.0;
    g.globalAlpha = al*0.85;
    g.drawImage(spr[0], px-sz/2, py-sz/2, sz, sz);
  }

  /* ===== 3. 内圈 ===== */
  for (let i=0;i<inners.length;i++){
    const p = inners[i];
    if (p.a <= 0.01) continue;
    const bx = cx + p.ox * sc, by = cy + p.oy * sc;
    const al  = p.a*p.br*br*(0.62 + 0.38*Math.sin(t*p.sp*1.7 + p.ph*2.0));
    const spr = sprFor(p.col);
    const sz = p.r * 7.0;
    g.globalAlpha = al*0.62;
    g.drawImage(spr[0], bx-sz/2, by-sz/2, sz, sz);
  }

  /* ===== 4. 主环 ===== */
  const elapsed = (performance.now() - T0);
  const detail = (fps < 40 ? 2 : 1);        // 掉帧时跳着画
  for (let i=0;i<parts.length;i++){
    const p = parts[i];
    if (detail > 1 && (i & 1)) { if (p.tq<1) continue; }
    // 飞入
    if (p.tq < 1){
      const k = (elapsed - p.dly) / 1150;
      if (k <= 0) continue;
      if (k < 1){
        const e = 1 - Math.pow(1 - k, 3);
        p.x = p.x0 + (p.tx - p.x0) * e;
        p.y = p.y0 + (p.ty - p.y0) * e;
        p.vis = 0.30 + 0.70 * e;
      } else {
        p.tq = 1; p.x = p.tx; p.y = p.ty; p.vis = 1;
      }
    } else {
      trk(TRK_RING, i, (t*p.sp*0.11 + p.ph) * 0.15915494, _tb);
      p.x = p.tx + _tb[0];
      p.y = p.ty + _tb[1];
      p.vis = 1;
    }

    // 变换到全局
    const px = cx + (p.x - cx) * sc;
    const py = cy + (p.y - cy) * sc;

    const wob = 0.78 + 0.22*Math.sin(t*p.sp*2.4 + p.ph*3.1);
    let al = p.vis * p.br * wob * br;
    if (al <= 0.02) continue;
    if (al > 1) al = 1;
    const r = p.r * (0.94 + 0.12*Math.sin(t*p.sp*1.7 + p.ph));
    const spr = sprFor(p.col);

    // 光晕
    const sz = r * 9.5;
    g.globalAlpha = al*0.55;
    g.drawImage(spr[0], px-sz/2, py-sz/2, sz, sz);
    // 核心
    const sz2 = r * 3.6;
    g.globalAlpha = al;
    g.drawImage(spr[1], px-sz2/2, py-sz2/2, sz2, sz2);
    // 高光点
    if (r > 2.4){
      const sz3 = r * 1.9;
      g.globalAlpha = al*0.95;
      g.drawImage(spr[2], px-sz3/2, py-sz3/2, sz3, sz3);
    }
  }

  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
}

/* 飞入阶段：从屏幕外位置向中心缩放插值 */
function SD(dx, dy){
  const k = VIS.scale;
  return [coreCxPx + dx*k, coreCyPx + dy*k];
}

/* ---------- 暗角 ---------- */
let vigCache = null, vigKey='';
function drawVignette(){
  const key = VW+'x'+VH;

    gd.addColorStop(0, 'rgba(0,0,0,0)');

}

   词条交互：手指靠近哪颗粒子，就显示它那句话
   ============================================================ */
const tipEl = document.getElementById('tip');
const tipTxt = document.getElementById('tipTxt');
let lastTipKey = -1;
const GRID_CELL = 26;
let gridMap = null;
let gridKey = '';
function buildGrid(){
  const key = VW+'x'+VH+'_'+LW.toFixed(0)+'_'+sceneIdx;
  if (key === gridKey && gridMap) return;
  gridKey = key;
  gridMap = new Map();
  function put(x, y, kind, idx){
    const gx = Math.floor(x / GRID_CELL);
    const gy = Math.floor(y / GRID_CELL);
    const k = gx + ',' + gy;
    let arr = gridMap.get(k);
    if (!arr){ arr = []; gridMap.set(k, arr); }
    arr.push(kind, idx, x, y);
  }
  for (let i=0;i<parts.length;i++){
    if (parts[i].tq >= 1) put(parts[i].tx, parts[i].ty, 0, i);
  }
  for (let i=0;i<inners.length;i++){
    if (inners[i].a > 0.05) put(inners[i].tx, inners[i].ty, 1, i);
  }
  for (let i=0;i<fills.length;i++){
    if (fills[i].a > 0.05) put(fills[i].tx, fills[i].ty, 2, i);
  }
}
function nearestParticle(mx, my){
  buildGrid();
  const gx = Math.floor(mx / GRID_CELL);
  const gy = Math.floor(my / GRID_CELL);
  let best = -1, bestD = 1e9, bestKind = 0;
  for (let ox=-1; ox<=1; ox++){
    for (let oy=-1; oy<=1; oy++){
      const arr = gridMap.get((gx+ox) + ',' + (gy+oy));
      if (!arr) continue;
      for (let j=0;j<arr.length;j+=4){
        const dx = arr[j+2] - mx, dy = arr[j+3] - my;
        const d = dx*dx + dy*dy;
        if (d < bestD){ bestD = d; best = arr[j+1]; bestKind = arr[j]; }
      }
    }
  }
  if (best < 0) return null;
  if (bestD > 40*40) return null;
  return { kind: bestKind, idx: best };
}
function showTip(mx, my, hit){
  if (!hit) return;
  const key = hit.kind * 100000 + hit.idx;
  if (key === lastTipKey){
    tipEl.style.left = mx + 'px';
    tipEl.style.top  = (my - 4) + 'px';
    return;
  }
  lastTipKey = key;
  const text = phraseOf(hit.kind, hit.idx);
  if (!text){ hideTip(); return; }
  tipTxt.textContent = text;
  const pad = 14;
  let tx = mx, ty = my - 4;
  tipEl.style.left = tx + 'px';
  tipEl.style.top  = ty + 'px';
  tipEl.classList.add('on');
  requestAnimationFrame(()=>{
    const r = tipEl.getBoundingClientRect();
    const halfW = r.width / 2;
    if (tx - halfW < pad) tx = halfW + pad;
    if (tx + halfW > VW - pad) tx = VW - pad - halfW;
    if (ty - r.height / 2 < pad) ty = r.height / 2 + pad;
    if (ty + r.height / 2 > VH - pad) ty = VH - pad - r.height / 2;
    tipEl.style.left = tx + 'px';
    tipEl.style.top  = ty + 'px';
  });
}
function hideTip(){
  tipEl.classList.remove('on');
  lastTipKey = -1;
}
let touching = false;
function onPointer(clientX, clientY){
  if (!started) return;
  const hit = nearestParticle(clientX, clientY);
  if (hit) showTip(clientX, clientY, hit);
  else hideTip();
}
window.addEventListener('touchmove', (e)=>{
  const t = e.touches[0];
  if (t) onPointer(t.clientX, t.clientY);
}, {passive:true});
window.addEventListener('touchend', ()=>{ touching=false; hideTip(); }, {passive:true});
window.addEventListener('mousemove', (e)=>{
  if (touching) return;
  onPointer(e.clientX, e.clientY);
});
window.addEventListener('mouseleave', hideTip);

function todayInfo(){
  const d = new Date();
  const y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
  // 从 1461 天日历里找今天
  let rec = null;
  for (let i=0;i<CALENDAR.length;i++){
    const c = CALENDAR[i];
    if (c[0]===y && c[1]===m && c[2]===day){ rec = c; break; }
  }
  // 从 100 年节气表里找当前节气
  let curTerm = '', curIdx = -1;
  for (let i=0;i<TERMS100.length;i++){
    const row = TERMS100[i];
    if (row[0] !== y) continue;
    for (let k=0;k<24;k++){
      const t = row[1][k];
      if (m > t[0] || (m === t[0] && day >= t[1])){ curIdx = k; curTerm = TERMS_NAMES[k]; }
    }
  }
  if (!curTerm){ curTerm = '小寒'; curIdx = 0; }
  return { d: d, y, m, day, rec, curTerm, curIdx };
}

    h += '<button id="msgSend" type="button" style="margin-top:9px;width:100%;padding:10px 0;border-radius:11px;background:rgba(255,60,140,.18);border:1px solid rgba(255,150,200,.38);color:#ffd9ea;font-size:12.5px;letter-spacing:.24em;font-family:inherit;">送 出</button>';
    h += '<div id="msgTip" class="hintsmall" style="text-align:center;"></div>';
    h += '</div>';
  }
  panelBody.innerHTML = h;
  panelBody.scrollTop = 0;
  if (i === 4) bindMessageTab();
}

function renderCalendar(y, m){
  const first = new Date(y, m-1, 1);
  const days = new Date(y, m, 0).getDate();
  const lead = (first.getDay() + 6) % 7;   // 周一开头
  let h = '<div class="calTitle">' + y + ' 年 ' + m + ' 月</div>';
  h += '<div class="calHead"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>';
  h += '<div class="calGrid">';
  for (let i=0;i<lead;i++) h += '<div class="calCell empty"></div>';
  const today = new Date();
  for (let d=1; d<=days; d++){
    let term = "", fest = "", lfest = "", isHol = false;
    for (let ci = 0; ci < CALENDAR.length; ci++){
      const c = CALENDAR[ci];
      if (c[0] === y && c[1] === m && c[2] === d){
        term = c[4] || "";
        fest = c[5] || "";
        lfest = c[7] || "";
        isHol = !!c[8];
        break;
      }
    }
    const isToday = (today.getFullYear()===y && today.getMonth()+1===m && today.getDate()===d);
    var cls = "calCell" + (isToday ? " today" : "") + (isHol ? " hol" : "");
    h += '<div class="' + cls + '">' +
         '<span class="dn">' + d + '</span>' +
         (term ? '<span class="dt">' + term + '</span>' : '') +
         (lfest ? '<span class="dl">' + lfest + '</span>'
                : (fest && !term ? '<span class="df">' + fest + '</span>' : '')) +
         '</div>';
  }
  h += '</div>';
  return h;
}

function escHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    if (c === '&') return '\u0026amp;';
    if (c === '<') return '\u0026lt;';
    if (c === '>') return '\u0026gt;';
    if (c === '"') return '\u0026quot;';
    return '\u0026#39;';
  });
}
function escAttr(s){ return escHtml(s); }

/* 直连 Supabase REST，不经过 Edge Function */
const SB_URL  = 'https://ygoafnqobpxbplxpuqse.supabase.co';
const SB_KEY  = 'sb_publishable_3oYqwqQUnYjfNC7KHsHRbQ_l9ROn6MI';
const SB_HDRS = {
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'content-type': 'application/json'
};

/* 留言缓存：页面加载时预取，切 Tab 秒开 */
var MSG_CACHE = null;

function prefetchMessages(){
  fetch(SB_URL + '/rest/v1/messages?select=name,content,created_at&order=created_at.desc&limit=200', {
    headers: SB_HDRS,
    cache: 'no-store'
  })
    .then(function(r){ if (!r.ok) throw 0; return r.json(); })
    .then(function(d){
      MSG_CACHE = Array.isArray(d) ? d : [];
      var el = document.getElementById('msgList');
      if (el && document.getElementById('msgSend')) renderListInto(el, MSG_CACHE);
    })
    .catch(function(){});
}

function renderListInto(el, arr){
  if (!arr || !arr.length){
    el.innerHTML = '<div class="kv">还没有留言，说点什么吧。</div>';
    return;
  }
  var h = '';
  for (var i = 0; i < arr.length; i++){
    var m = arr[i];
    var t = m.created_at ? new Date(m.created_at) : new Date();
    var ds = t.getFullYear() + '-' +
             String(t.getMonth() + 1).padStart(2, '0') + '-' +
             String(t.getDate()).padStart(2, '0') + ' ' +
             String(t.getHours()).padStart(2, '0') + ':' +
             String(t.getMinutes()).padStart(2, '0');
    h += '<div class="strow">' +
         '<b>' + escHtml(m.name || '匿名') + '</b>' +
         '<i>' + ds + '</i>' +
         '<span>' + escHtml(m.content) + '</span>' +
         '</div>';
  }
  el.innerHTML = h;
}

function bindMessageTab(){
  var listEl = document.getElementById('msgList');
  var sendEl = document.getElementById('msgSend');
  var textEl = document.getElementById('msgText');
  var nameEl = document.getElementById('msgName');
  var tipEl  = document.getElementById('msgTip');
  if (!listEl || !sendEl) return;

  if (MSG_CACHE){
    renderList(MSG_CACHE);
  }


  function tip(msg){
    if (tipEl){ tipEl.textContent = msg || ''; }
  }

  function renderList(arr){
    renderListInto(listEl, arr);
  }

  var loading = false;
  function load(attempt){
    attempt = attempt || 0;
    if (loading) return;
    loading = true;
    if (attempt === 0 && !listEl.dataset.hasData){
      listEl.innerHTML = '<div class="kv">加载中…</div>';
    }
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 15000);

    fetch(SB_URL + '/rest/v1/messages?select=name,content,created_at&order=created_at.desc&limit=200', {
      headers: SB_HDRS,
      cache: 'no-store',
      signal: ctrl ? ctrl.signal : undefined
    })
      .then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(d){
        clearTimeout(timer);
        loading = false;
        listEl.dataset.hasData = '1';
        MSG_CACHE = Array.isArray(d) ? d : [];
        renderList(MSG_CACHE);
      })
      .catch(function(){
        clearTimeout(timer);
        loading = false;
        if (attempt < 3){
          setTimeout(function(){ load(attempt + 1); }, 600 * (attempt + 1));
        } else if (!listEl.dataset.hasData){
          listEl.innerHTML = '<div class="kv">加载慢了点，点这里重试</div>';
          var btn = listEl.querySelector('.kv');
          if (btn){
            btn.style.cursor = 'pointer';
            btn.onclick = function(){ delete listEl.dataset.hasData; load(0); };
          }
        }
      });
  }

  sendEl.onclick = function(ev){
    ev.stopPropagation();
    var content = (textEl.value || '').trim();
    var name = (nameEl.value || '').trim();
    if (!content){ tip('还没写内容'); return; }

    var last = parseInt(localStorage.getItem('lastSay') || '0', 10);
    if (Date.now() - last < 3000){ tip('慢一点，刚发过'); return; }
    localStorage.setItem('lastSay', String(Date.now()));
    localStorage.setItem('msgName', name);

    sendEl.disabled = true;
    tip('送出中…');

    fetch(SB_URL + '/rest/v1/messages', {
      method: 'POST',
      headers: Object.assign({ 'Prefer': 'return=minimal' }, SB_HDRS),
      body: JSON.stringify({ name: name || '匿名', content: content })
    })
    .then(function(r){
      sendEl.disabled = false;
      if (r.ok || r.status === 201){
        textEl.value = '';
        tip('已送出');
        load();
      } else {
        tip('送出失败 ' + r.status);
      }
    })
    .catch(function(){
      sendEl.disabled = false;
      tip('网络错误');
    });
  };

  load();
}
